<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Majesty Day Spa — Inquiry & Booking Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A22;
    --bg:#FAF7F1;
    --card:#FFFFFF;
    --forest:#1F3D2E;
    --forest-dim:#2C5340;
    --gold:#B8935F;
    --gold-light:#E4D2B4;
    --sage:#7C9985;
    --line:rgba(27,42,34,0.1);
    --hot:#B4482F;
    --warm:#B8935F;
    --gen:#7C9985;
    --radius:14px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Jost',sans-serif;
    font-weight:400;
    line-height:1.6;
    min-height:100vh;
  }
  .serif{font-family:'Cormorant Garamond',serif;}
  .container{max-width:960px;margin:0 auto;padding:0 24px;}

  /* NAV */
  .topbar{
    background:var(--forest);
    color:#F5F0E6;
    padding:20px 0;
    border-bottom:3px solid var(--gold);
  }
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;}
  .brand{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;letter-spacing:0.03em;}
  .brand span{color:var(--gold);}
  .view-toggle{display:flex;gap:8px;}
  .view-btn{
    background:transparent;border:1px solid rgba(245,240,230,0.35);color:#F5F0E6;
    padding:8px 18px;border-radius:99px;font-family:'Jost',sans-serif;font-size:0.82rem;
    letter-spacing:0.04em;cursor:pointer;transition:all .2s;
  }
  .view-btn.active{background:var(--gold);border-color:var(--gold);color:#1B2A22;font-weight:600;}

  .page{display:none;padding:56px 0 80px;}
  .page.active{display:block;}

  /* HERO */
  .hero-block{text-align:center;margin-bottom:48px;}
  .eyebrow{font-size:0.75rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px;}
  .hero-title{font-size:clamp(2rem,4vw,2.8rem);font-weight:600;margin-bottom:12px;}
  .hero-sub{color:var(--sage);max-width:520px;margin:0 auto;font-size:0.98rem;}

  /* FORM */
  .form-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:40px;
    box-shadow:0 20px 60px rgba(27,42,34,0.06);
  }
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .form-group{display:flex;flex-direction:column;gap:6px;}
  .form-group.full{grid-column:1/-1;}
  label{font-size:0.78rem;font-weight:500;color:var(--forest);letter-spacing:0.03em;}
  input,select,textarea{
    font-family:'Jost',sans-serif;font-size:0.92rem;padding:11px 14px;
    border:1px solid var(--line);border-radius:8px;background:#FCFAF6;color:var(--ink);
    outline:none;transition:border-color .2s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--gold);}
  textarea{min-height:100px;resize:vertical;}
  .radio-row{display:flex;gap:18px;padding-top:6px;}
  .radio-opt{display:flex;align-items:center;gap:6px;font-size:0.88rem;}
  .submit-btn{
    margin-top:28px;width:100%;padding:15px;background:var(--forest);color:#F5F0E6;
    border:none;border-radius:8px;font-family:'Jost',sans-serif;font-weight:500;font-size:0.95rem;
    letter-spacing:0.03em;cursor:pointer;transition:background .2s;
  }
  .submit-btn:hover{background:var(--forest-dim);}
  .submit-btn:disabled{opacity:0.6;cursor:wait;}

  /* AI RESULT CARD */
  .result-card{
    margin-top:32px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:32px;display:none;
  }
  .result-card.show{display:block;}
  .result-title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;margin-bottom:18px;}
  .badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:99px;font-size:0.72rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#fff;}
  .badge-hot{background:var(--hot);}
  .badge-warm{background:var(--warm);}
  .badge-general{background:var(--gen);}
  .result-block{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
  .result-block h4{font-size:0.78rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;font-weight:600;}
  .result-block p{font-size:0.9rem;color:var(--ink);}
  .automation-log{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .log-row{display:flex;align-items:center;gap:10px;font-size:0.85rem;}
  .log-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .log-ok{background:#4a8a5f;}
  .log-fail{background:var(--hot);}

  /* DASHBOARD */
  .dash-header{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px;flex-wrap:wrap;gap:16px;}
  .dash-controls{display:flex;gap:10px;flex-wrap:wrap;}
  .dash-controls input,.dash-controls select{padding:9px 12px;font-size:0.85rem;}
  .lead-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 10px 40px rgba(27,42,34,0.05);}
  .lead-table th{background:var(--forest);color:#F5F0E6;text-align:left;padding:12px 16px;font-size:0.76rem;letter-spacing:0.04em;text-transform:uppercase;font-weight:500;}
  .lead-table td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:0.87rem;vertical-align:top;}
  .lead-table tr:last-child td{border-bottom:none;}
  .lead-table tr:hover{background:#FCFAF6;cursor:pointer;}
  .status-pill{padding:3px 10px;border-radius:99px;font-size:0.72rem;font-weight:600;background:var(--gold-light);color:var(--forest);}
  .empty-state{text-align:center;padding:60px 20px;color:var(--sage);}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(27,42,34,0.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:var(--card);border-radius:var(--radius);max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:32px;position:relative;}
  .modal-close{position:absolute;top:18px;right:18px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--sage);}
  .status-select{margin-top:6px;}
  .edit-response{width:100%;min-height:110px;margin-top:8px;}
  .save-response-btn{margin-top:10px;padding:9px 20px;background:var(--gold);border:none;border-radius:8px;font-size:0.85rem;font-weight:600;cursor:pointer;}

  @media(max-width:700px){
    .form-grid{grid-template-columns:1fr;}
    .topbar-inner{flex-direction:column;gap:14px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="container topbar-inner">
    <div class="brand">Majesty <span>Day Spa</span></div>
  </div>
</div>

<div class="page active" id="page-inquiry">
  <div class="container">
    <div class="hero-block">
      <div class="eyebrow">Concierge Inquiry</div>
      <h1 class="hero-title serif">Tell us what you need — we'll take it from there</h1>
      <p class="hero-sub">Share a few details and our concierge will recommend the right service and next step for your visit.</p>
    </div>

    <div class="form-card">
      <form id="inquiryForm" class="form-grid">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="firstName" required />
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="lastName" required />
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="phone" required />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label>How did you hear about us?</label>
          <select id="howHeard">
            <option>Google Search</option>
            <option>Instagram / Facebook</option>
            <option>Groupon</option>
            <option>Friend / Referral</option>
            <option>Advertising Campaign</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Do you have a Groupon?</label>
          <div class="radio-row">
            <label class="radio-opt"><input type="radio" name="groupon" value="yes"> Yes</label>
            <label class="radio-opt"><input type="radio" name="groupon" value="no" checked> No</label>
          </div>
        </div>
        <div class="form-group">
          <label>Service Category of Interest</label>
          <select id="serviceCategory">
            <option>Massage</option>
            <option>Facial</option>
            <option>Body Treatment</option>
            <option>Couples Package</option>
            <option>Not Sure Yet</option>
          </select>
        </div>
        <div class="form-group">
          <label>Preferred Contact Method</label>
          <select id="contactMethod">
            <option>Phone</option>
            <option>Text</option>
            <option>Email</option>
          </select>
        </div>
        <div class="form-group">
          <label>Preferred Appointment Date</label>
          <input type="date" id="prefDate" />
        </div>
        <div class="form-group">
          <label>Preferred Time</label>
          <input type="time" id="prefTime" />
        </div>
        <div class="form-group full">
          <label>Tell us what you need</label>
          <textarea id="message" placeholder="Describe your visit, occasion, or any concerns..." required></textarea>
        </div>
        <div class="form-group full">
          <button type="submit" class="submit-btn" id="submitBtn">Submit Inquiry</button>
        </div>
      </form>
    </div>

    <div class="result-card" id="resultCard"></div>
  </div>
</div>

<script>
const webhookUrl = 'https://n8n-rclicksolutions.onrender.com/webhook-test/f04a480f-31dd-4636-9ab5-4a77fe5bd685';

function showResult(message, isError = false){
  const resultCard = document.getElementById('resultCard');
  resultCard.innerHTML = `<p style="color:${isError ? '#B4482F' : '#1B2A22'};margin:0;font-size:1rem;">${message}</p>`;
  resultCard.classList.add('show');
}

async function sendWebhook(payload){
  const response = await fetch(webhookUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  if (!response.ok) {
    const details = await response.text();
    throw new Error(`Webhook request failed: ${response.status} ${response.statusText} ${details}`);
  }
}

document.getElementById('inquiryForm').addEventListener('submit', async function(event){
  event.preventDefault();
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending inquiry...';
  document.getElementById('resultCard').classList.remove('show');

  const payload = {
    submittedAt: new Date().toISOString(),
    firstName: document.getElementById('firstName').value.trim(),
    lastName: document.getElementById('lastName').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    email: document.getElementById('email').value.trim(),
    howHeard: document.getElementById('howHeard').value,
    groupon: document.querySelector('input[name="groupon"]:checked').value,
    serviceCategory: document.getElementById('serviceCategory').value,
    contactMethod: document.getElementById('contactMethod').value,
    prefDate: document.getElementById('prefDate').value,
    prefTime: document.getElementById('prefTime').value,
    message: document.getElementById('message').value.trim()
  };

  try {
    await sendWebhook(payload);
    showResult('Your inquiry was sent successfully. Thank you! We will contact you soon.');
    document.getElementById('inquiryForm').reset();
  } catch (error) {
    console.error(error);
    showResult('Unable to send your inquiry right now. Please try again or contact us directly.', true);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit Inquiry';
  }
});
</script>
</body>
</html>
